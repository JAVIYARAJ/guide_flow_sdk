# Project-wide Gradle settings.
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Daemon JVM heap — increased for multi-module SDK projects
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel project execution (safe for decoupled modules)
org.gradle.parallel=true

# Configuration cache — speeds up repeated builds
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official

# Suppress incremental annotation processing warnings
kapt.use.worker.api=true

# Android
android.useAndroidX=true