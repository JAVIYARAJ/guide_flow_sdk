[versions]
agp                     = "9.2.1"
kotlin                  = "2.1.21"
coreKtx                 = "1.16.0"
appcompat               = "1.7.1"
material                = "1.12.0"
activity                = "1.10.1"
fragment                = "1.8.8"
recyclerview            = "1.4.0"
viewpager2              = "1.1.0"
constraintlayout        = "2.2.1"
coordinatorlayout       = "1.3.0"
lifecycleRuntime        = "2.9.1"

# Navigation
navigationFragment      = "2.9.0"
navigationUi            = "2.9.0"

# Testing
junit                   = "4.13.2"
junitVersion            = "1.2.1"
espressoCore            = "3.6.1"
mockk                   = "1.14.2"
coroutinesTest          = "1.10.2"

# Coroutines
coroutines              = "1.10.2"

# Static Analysis
detekt                  = "1.23.8"
ktlint                  = "12.2.0"

# Publishing
vanniktech               = "0.29.0"

[libraries]
# Core
androidx-core-ktx        = { group = "androidx.core",                 name = "core-ktx",             version.ref = "coreKtx" }
androidx-appcompat       = { group = "androidx.appcompat",            name = "appcompat",             version.ref = "appcompat" }
material                 = { group = "com.google.android.material",   name = "material",              version.ref = "material" }
androidx-activity        = { group = "androidx.activity",             name = "activity-ktx",          version.ref = "activity" }
androidx-fragment        = { group = "androidx.fragment",             name = "fragment-ktx",          version.ref = "fragment" }
androidx-recyclerview    = { group = "androidx.recyclerview",         name = "recyclerview",          version.ref = "recyclerview" }
androidx-viewpager2      = { group = "androidx.viewpager2",           name = "viewpager2",            version.ref = "viewpager2" }
androidx-constraintlayout = { group = "androidx.constraintlayout",   name = "constraintlayout",      version.ref = "constraintlayout" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout",     version.ref = "coordinatorlayout" }

# Lifecycle
androidx-lifecycle-runtime = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }

# Navigation
androidx-navigation-fragment = { group = "androidx.navigation",      name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
androidx-navigation-ui       = { group = "androidx.navigation",      name = "navigation-ui-ktx",       version.ref = "navigationUi" }

# Kotlin Coroutines
kotlinx-coroutines-core    = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit                    = { group = "junit",                         name = "junit",                 version.ref = "junit" }
androidx-junit           = { group = "androidx.test.ext",             name = "junit",                 version.ref = "junitVersion" }
androidx-espresso-core   = { group = "androidx.test.espresso",        name = "espresso-core",         version.ref = "espressoCore" }
mockk                    = { group = "io.mockk",                      name = "mockk",                 version.ref = "mockk" }
kotlinx-coroutines-test  = { group = "org.jetbrains.kotlinx",         name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[bundles]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "material"]
navigation    = ["androidx-navigation-fragment", "androidx-navigation-ui"]
coroutines    = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
testing       = ["junit", "mockk", "kotlinx-coroutines-test"]
android-test  = ["androidx-junit", "androidx-espresso-core"]

[plugins]
android-application  = { id = "com.android.application",     version.ref = "agp" }
android-library      = { id = "com.android.library",         version.ref = "agp" }
# Note: kotlin-android is bundled by AGP 9 — add back explicitly if you downgrade AGP
detekt               = { id = "io.gitlab.arturbosch.detekt",  version.ref = "detekt" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
vanniktech-publish   = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
# safe-args — add when Navigation Component is introduced (Milestone 2+)
# safe-args = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigationFragment" }
